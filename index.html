<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="水墨普宁 · 洪阳镇中心 —— Three.js 水墨风三维古镇" />
    <title>水墨洪阳</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* 宣纸铺满页面底层，WebGL 画布透明叠在上面；
        M1 的宣纸纹理是程序化生成的，之后可用 AI 生图的 T_Paper.png 直接替换 */
      body {
        background: #f2eddf url("assets/textures/T_Paper.png") repeat;
        background-size: 512px 512px;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        font: 13px/1.6 "Songti SC", "SimSun", serif;
        color: #8a7f68;
        letter-spacing: 0.2em;
        user-select: none;
        pointer-events: none;
      }
      #dusk-tint {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.4s ease;
        background: linear-gradient(180deg, rgba(96, 66, 88, 0.5), rgba(52, 40, 56, 0.62));
        z-index: 4;
      }
      #music-btn {
        position: fixed;
        right: 12px;
        bottom: 64px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1.5px solid #8a7f68;
        background: rgba(246, 242, 231, 0.75);
        color: #6b6250;
        font-size: 18px;
        cursor: pointer;
        z-index: 6;
        transition: background 0.3s, color 0.3s;
      }
      #music-btn.active {
        background: #8f2b22;
        color: #f6f2e7;
        border-color: #8f2b22;
      }
      #dusk-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 5px 12px;
        border-radius: 14px;
        border: 1.5px solid #8a7f68;
        background: rgba(246, 242, 231, 0.75);
        color: #6b6250;
        font: 13px "KaiTi", "SimSun", serif;
        letter-spacing: 0.2em;
        cursor: pointer;
        z-index: 6;
        transition: background 0.3s, color 0.3s;
      }
      #dusk-btn.active {
        background: #43364a;
        color: #f6f2e7;
        border-color: #43364a;
      }
      #osm {
        position: fixed;
        right: 10px;
        bottom: 8px;
        font: 10px/1.4 "Songti SC", "SimSun", serif;
        color: rgba(138, 127, 104, 0.65);
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Bly9nJ0X.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="dusk-tint"></div>
    <button id="dusk-btn" title="切换日暮">暮</button>
    <button id="music-btn" title="背景音乐开关">♪</button>
    <div id="hint">水墨洪阳 · M11 —— 氛围与动效</div>
    <div id="osm">地图数据 © OpenStreetMap contributors</div>
  </body>
</html>
