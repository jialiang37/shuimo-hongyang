<!doctype html>
<html lang="zh-CN">
  <head>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;

        background: #f2eddf url("assets/textures/T_Paper.png") repeat;
        background-size: 512px 512px;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;

      #hint {
        position: fixed;

        right: 10px;
        bottom: 8px;
        font: 10px/1.4 "Songti SC", "SimSun", serif;
        color: rgba(138, 127, 104, 0.65);

        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-ChXxY7rw.js"></script>

  <body>
